services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    container_name: infradesk-dev
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4200:4200"
      - "3001:3001"
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    container_name: infradesk-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: infradeskProject
      KC_DB_PASSWORD: infradeskProject
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-infradesk.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
  postgres:
    image: postgres:17-alpine
    container_name: infradesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: infradeskProject
      POSTGRES_PASSWORD: infradeskProject
      POSTGRES_DB: infradeskProject
    ports:
      - "5433:5432"
    volumes:
      - infradesk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infradeskProject -d infradeskProject"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  infradesk-pgdata: