services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    container_name: infradesk-dev
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4200:4200"
      - "3001:3001"
  postgres:
    image: postgres:17-alpine
    container_name: infradesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: infradeskProject
      POSTGRES_PASSWORD: infradeskProject
      POSTGRES_DB: infradeskProject
    ports:
      - "5433:5432"
    volumes:
      - infradesk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infradeskProject -d infradeskProject"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  infradesk-pgdata: