services:
  postgres:
    image: postgres:17-alpine
    container_name: infradesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: infradeskProject
      POSTGRES_PASSWORD: infradeskProject
      POSTGRES_DB: infradeskProject
    ports:
      - "5433:5432"
    volumes:
      - infradesk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infradeskProject -d infradeskProject"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  infradesk-pgdata: